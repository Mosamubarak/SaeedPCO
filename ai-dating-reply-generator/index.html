<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Dating Reply Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header card">
        <h1>AI Dating Reply Generator</h1>
        <p>Upload screenshot, corrigeer tekst en genereer direct replies.</p>
      </header>

      <section class="grid">
        <article class="card">
          <h2>Input</h2>
          <label for="upload">Screenshot upload</label>
          <input id="upload" type="file" accept="image/*" />
          <p class="hint">OCR is nu placeholder. Plak/controleer de chat hieronder.</p>

          <label for="chatText">Chat inhoud</label>
          <textarea id="chatText" rows="8" placeholder="Plak hier het bericht dat je kreeg..."></textarea>

          <label>Mood</label>
          <div class="modes">
            <label><input type="radio" name="mood" value="standard" checked /> Standard</label>
            <label><input type="radio" name="mood" value="spicy" /> Spicy</label>
            <label><input type="radio" name="mood" value="hot" /> Hot</label>
          </div>

          <label for="goal">Doel</label>
          <select id="goal">
            <option value="date">Date regelen</option>
            <option value="flirt">Meer flirt</option>
            <option value="mystery">Mysterieus blijven</option>
          </select>

          <div class="actions">
            <button id="generate" class="btn btn-primary">Genereer</button>
            <button id="reset" class="btn">Reset</button>
          </div>
          <p id="status" class="status"></p>
        </article>

        <article class="card">
          <h2>Replies</h2>
          <div id="results"></div>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
